<div class="space-y-6">
  <div class="flex items-center justify-between bg-slate-900 border border-slate-800 rounded-lg p-4">
    <div>
      <h2 class="text-sm font-semibold text-slate-100">Scene Visuals, BGM & Watermark</h2>
      <p class="text-xs text-slate-400">Generate Gemini reference-guided frames or drop custom PNG/MP4/audio files.</p>
    </div>
    <button
      type="button"
      @click="generateImages()"
      :disabled="busy.images || !script"
      class="px-4 py-2 rounded bg-amber-600 hover:bg-amber-500 text-slate-950 font-semibold text-sm disabled:opacity-50"
      x-text="busy.images ? 'Generating Frames...' : 'Generate Scene Frames'"
    ></button>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
    <div
      @dragover.prevent
      @drop.prevent="handleDrop($event, 'bgm')"
      class="bg-slate-900 border border-dashed border-slate-700 rounded-lg p-5 space-y-2"
    >
      <p class="text-xs font-semibold text-slate-200">Background Music (BGM)</p>
      <p class="text-xs text-slate-400" x-text="bgmPath || 'Drop .mp3 / .wav here or choose file'"></p>
      <input type="file" accept=".mp3,.wav,.ogg" @change="uploadAsset($event.target.files[0], 'bgm')" class="text-xs text-slate-400" />
    </div>
    <div
      @dragover.prevent
      @drop.prevent="handleDrop($event, 'watermark')"
      class="bg-slate-900 border border-dashed border-slate-700 rounded-lg p-5 space-y-2"
    >
      <p class="text-xs font-semibold text-slate-200">Watermark PNG (RGBA)</p>
      <p class="text-xs text-slate-400" x-text="watermarkPath || 'Drop transparent PNG here (optional)'"></p>
      <input type="file" accept=".png,.webp" @change="uploadAsset($event.target.files[0], 'watermark')" class="text-xs text-slate-400" />
    </div>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-3 gap-4" x-show="script">
    <template x-for="scene in (script?.scenes || [])" :key="scene.id">
      <div
        @dragover.prevent
        @drop.prevent="handleDrop($event, 'scene', scene.id)"
        class="bg-slate-900 border border-slate-800 rounded-lg p-4 space-y-2"
      >
        <div class="flex justify-between text-xs font-mono text-slate-400">
          <span x-text="`SCENE ${scene.id}`"></span>
          <span x-text="scene.beat"></span>
        </div>
        <p class="text-xs text-slate-300 line-clamp-2" x-text="scene.visual_direction"></p>
        <p class="text-[11px] font-mono text-amber-400 truncate" x-text="scene.image_path || 'Drop image/clip or generate above'"></p>
        <input type="file" accept=".png,.jpg,.jpeg,.webp,.mp4,.mov" @change="uploadAsset($event.target.files[0], 'scene', scene.id)" class="text-xs text-slate-400 w-full" />
      </div>
    </template>
  </div>
</div>
