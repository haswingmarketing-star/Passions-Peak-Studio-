<div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
  <section class="bg-slate-900 border border-slate-800 rounded-lg p-5 space-y-4">
    <h2 class="text-sm font-semibold text-slate-100">Voiceover Engine & Mix Controls</h2>
    <div>
      <label class="block text-xs text-slate-400 mb-1">TTS Provider</label>
      <select x-model="audioForm.tts_engine" class="w-full bg-slate-950 border border-slate-700 rounded px-3 py-2 text-sm">
        <option value="edge_tts">Edge-TTS (Free Local Default)</option>
        <option value="elevenlabs">ElevenLabs API (Paid Key via .env)</option>
      </select>
    </div>
    <div x-show="audioForm.tts_engine === 'edge_tts'">
      <label class="block text-xs text-slate-400 mb-1">Edge-TTS Voice</label>
      <select x-model="audioForm.edge_voice" class="w-full bg-slate-950 border border-slate-700 rounded px-3 py-2 text-sm font-mono">
        {% for v in edge_voices %}
        <option value="{{ v }}">{{ v }}</option>
        {% endfor %}
      </select>
    </div>
    <div x-show="audioForm.tts_engine === 'elevenlabs'">
      <label class="block text-xs text-slate-400 mb-1">ElevenLabs Voice ID</label>
      <input x-model="audioForm.elevenlabs_voice_id" class="w-full bg-slate-950 border border-slate-700 rounded px-3 py-2 text-sm font-mono" />
    </div>
    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block text-xs text-slate-400 mb-1">BGM Volume (<span x-text="audioForm.bgm_volume"></span>)</label>
        <input type="range" min="0" max="1" step="0.02" x-model.number="audioForm.bgm_volume" class="w-full" />
      </div>
      <div>
        <label class="block text-xs text-slate-400 mb-1">Ducking dB (<span x-text="audioForm.ducking_db"></span>)</label>
        <input type="range" min="0" max="24" step="1" x-model.number="audioForm.ducking_db" class="w-full" />
      </div>
    </div>
    <div class="flex gap-3">
      <button type="button" @click="synthesizeTts()" :disabled="busy.tts || !script" class="flex-1 py-2 px-4 rounded bg-amber-600 hover:bg-amber-500 text-slate-950 font-semibold text-sm disabled:opacity-50">
        Synthesize Voiceover
      </button>
      <button type="button" @click="generateCaptions()" :disabled="busy.captions" class="py-2 px-4 rounded border border-slate-700 hover:bg-slate-800 text-sm">
        Transcribe SRT (Whisper)
      </button>
    </div>
    <template x-if="voiceoverUrl">
      <audio :src="voiceoverUrl" controls class="w-full"></audio>
    </template>
  </section>

  <section class="bg-slate-900 border border-slate-800 rounded-lg p-5 space-y-3">
    <h2 class="text-sm font-semibold text-slate-100">SRT Captions</h2>
    <textarea x-model="srtContent" rows="16" class="w-full bg-slate-950 border border-slate-700 rounded p-3 text-xs font-mono"></textarea>
  </section>
</div>
