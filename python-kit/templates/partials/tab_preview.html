<div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
  <section class="bg-slate-900 border border-slate-800 rounded-lg p-5 space-y-4">
    <h2 class="text-sm font-semibold text-slate-100">Overlay & Caption Positioning</h2>
    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block text-xs text-slate-400 mb-1">Caption Y% (<span x-text="renderForm.caption_position_y"></span>%)</label>
        <input type="range" min="55" max="92" x-model.number="renderForm.caption_position_y" class="w-full" />
      </div>
      <div>
        <label class="block text-xs text-slate-400 mb-1">Caption Size (<span x-text="renderForm.caption_font_size"></span>px)</label>
        <input type="range" min="24" max="72" x-model.number="renderForm.caption_font_size" class="w-full" />
      </div>
      <div>
        <label class="block text-xs text-slate-400 mb-1">Watermark Opacity (<span x-text="renderForm.watermark_opacity"></span>)</label>
        <input type="range" min="0" max="1" step="0.05" x-model.number="renderForm.watermark_opacity" class="w-full" />
      </div>
      <div>
        <label class="block text-xs text-slate-400 mb-1">Watermark Corner</label>
        <select x-model="renderForm.watermark_position" class="w-full bg-slate-950 border border-slate-700 rounded px-2.5 py-1.5 text-sm">
          <option value="top_right">Top Right</option>
          <option value="top_left">Top Left</option>
          <option value="bottom_right">Bottom Right</option>
          <option value="bottom_left">Bottom Left</option>
        </select>
      </div>
    </div>
    <button type="button" @click="startRender(true)" class="py-2 px-4 rounded bg-amber-600 hover:bg-amber-500 text-slate-950 font-semibold text-sm">
      Render 3-Sec Test Clip
    </button>
  </section>

  <section class="bg-slate-900 border border-slate-800 rounded-lg p-5 flex flex-col items-center justify-center min-h-[380px]">
    <template x-if="lastRenderUrl">
      <video :src="lastRenderUrl" controls class="max-h-[420px] rounded border border-slate-700"></video>
    </template>
    <template x-if="!lastRenderUrl">
      <p class="text-sm text-slate-400">Run a 3-sec preview or full render to inspect the composite MP4 here.</p>
    </template>
  </section>
</div>
